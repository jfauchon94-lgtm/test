name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    name: Build Unsigned iOS .ipa on macOS
    runs-on: macos-15-intel


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Kotlin Multiplatform SharedUI Framework (iosArm64)
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64 --no-daemon

      - name: Generate Xcode Project & Install CocoaPods
        working-directory: iosApp
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate
          pod install --repo-update

      - name: Build iOS App (.app)
        working-directory: iosApp
        run: |
          xcodebuild \
            -workspace iosApp.xcworkspace \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      - name: Package .app into test-ios.ipa
        working-directory: iosApp
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/test.app Payload/
          zip -r9 test-ios.ipa Payload

      - name: Upload test-ios.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-ios-ipa
          path: iosApp/test-ios.ipa
          retention-days: 30

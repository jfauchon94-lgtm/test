name: Build, Sign & Deploy iOS IPA (OTA)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'shared/**'
      - 'iosApp/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build, Sign & Deploy iOS .ipa to GitHub Pages
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Kotlin Multiplatform SharedUI Framework (iosArm64)
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64 --no-daemon

      - name: Generate Xcode Project & Install CocoaPods
        working-directory: iosApp
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate
          pod install --repo-update

      - name: Build iOS App (.app)
        working-directory: iosApp
        run: |
          xcodebuild \
            -workspace iosApp.xcworkspace \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      - name: Package .app into test-ios.ipa
        working-directory: iosApp
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/test.app Payload/
          zip -r9 test-ios.ipa Payload

      - name: Sign .ipa with Apple Developer Certificate & Provisioning Profile
        working-directory: iosApp
        env:
          IOS_CERT_PEM_BASE64: ${{ secrets.IOS_CERT_PEM_BASE64 }}
          IOS_KEY_PEM_BASE64: ${{ secrets.IOS_KEY_PEM_BASE64 }}
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          echo "$IOS_CERT_PEM_BASE64" | base64 --decode > ios_development.pem
          echo "$IOS_KEY_PEM_BASE64" | base64 --decode > ios_development.key
          echo "$IOS_MOBILEPROVISION_BASE64" | base64 --decode > test_dev.mobileprovision
          cat << 'EOF' > entitlements.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>application-identifier</key>
              <string>3CB782KP5A.com.droid.test</string>
              <key>com.apple.developer.team-identifier</key>
              <string>3CB782KP5A</string>
              <key>get-task-allow</key>
              <true/>
              <key>keychain-access-groups</key>
              <array>
                  <string>3CB782KP5A.*</string>
              </array>
          </dict>
          </plist>
          EOF
          curl -sSL https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/apple-codesign-0.29.0-x86_64-apple-darwin.tar.gz | tar -xz
          ./apple-codesign-0.29.0-x86_64-apple-darwin/rcodesign sign \
            --pem-file ios_development.pem \
            --pem-file ios_development.key \
            --mobileprovision test_dev.mobileprovision \
            --entitlements-xml-file entitlements.plist \
            test-ios.ipa \
            ../ota/test-ios-signed.ipa

      - name: Upload Signed test-ios-signed.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-ios-signed-ipa
          path: ota/test-ios-signed.ipa
          retention-days: 30

      - name: Deploy OTA Installation Page to GitHub Pages (gh-pages)
        run: |
          cd ota
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .nojekyll index.html manifest.plist test-ios-signed.ipa
          git commit -m "Deploy signed iOS OTA build (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
